services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cms
      - dba
    networks:
      - app-net
    restart: unless-stopped

  cms:
    build: .
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      HASH_SALT: ${HASH_SALT}
    volumes:
      - cms_files:/var/www/html/files
      - cms_modules:/var/www/html/modules
      - cms_themes:/var/www/html/themes
      - cms_layouts:/var/www/html/layouts
    depends_on:
      - db
    networks:
      - app-net
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net
    restart: unless-stopped

  dba:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - app-net
    restart: unless-stopped

volumes:
  db_data:
  cms_files:
  cms_modules:
  cms_themes:
  cms_layouts:

networks:
  app-net:
