server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # /dba (tanpa garis miring) diarahkan ke /dba/
    location = /dba {
        return 301 /dba/;
    }

    # Semua request ke /dba/ -> service dba (phpMyAdmin) port 80
    location /dba/ {
        proxy_pass http://dba:80/;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # Semua request lainnya (/) -> service cms (Backdrop) port 80
    location / {
        proxy_pass http://cms:80;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}
